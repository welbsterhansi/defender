[project]
name = "defender-local-actions"
version = "0.1.0"
description = "Defender for Cloud ACR scan + OpenShift cross-reference + HTML report"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
# Legit typographical characters used in comments/HTML; not ambiguous in context.
allowed-confusables = ["–", "—", "−", "≥", "•", "…", "→", "×", "×"]

[tool.pyright]
include = ["expandcsv.py", "report.py", "group_findings.py", "tests"]
extraPaths = ["."]
pythonVersion = "3.11"
reportMissingImports = "error"
reportUnusedImport = "warning"
